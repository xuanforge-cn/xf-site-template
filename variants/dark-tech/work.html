<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-page="客户">客户 · 临界智能 NEXA</title>
  <meta name="description" content="临界智能的客户案例：自动驾驶、视频生成、券商、生物计算等团队的真实调度数据。">
  <meta name="author" content="github.com/xuanforge-cn">
  <meta name="copyright" content="github.com/xuanforge-cn">
  <meta name="theme-color" content="#0A0A0B">
  <link rel="stylesheet" href="assets/css/site.css">
  <script src="assets/js/brand.config.js"></script>
  <script src="assets/js/site.js" defer></script>
</head>
<body id="top">
  <main id="main">

    <section class="page-head">
      <div class="shell">
        <nav class="crumb" aria-label="面包屑">
          <a href="index.html">首页</a><span>/</span><span>客户</span>
        </nav>
        <h1 class="page-title">真实账单<br><span class="accent">比宣传页可信</span></h1>
        <p class="page-lead">
          下面每个数字都来自客户侧的监控或账单截图，我们可以在技术对接时提供原始数据。
          出于合规要求，部分客户名称做了脱敏。
        </p>
      </div>
    </section>

    <section class="section" aria-label="客户案例">
      <div class="shell">
        <div class="work-grid" data-work-grid></div>
      </div>
    </section>

    <section class="section" aria-labelledby="sla-title">
      <div class="shell">
        <div class="section-head">
          <div>
            <p class="label">Coverage</p>
            <h2 class="section-title" id="sla-title">这些团队<span class="thin">在跑什么</span></h2>
          </div>
          <p class="section-note">从 8 张卡的实验室到 480 张卡的生产集群，调度层是同一套代码。</p>
        </div>

        <div class="stats">
          <div class="stat">
            <span class="stat-num"><span data-count="12480">12480</span><small>张</small></span>
            <span class="stat-label">当前纳管的 GPU</span>
          </div>
          <div class="stat">
            <span class="stat-num"><span data-count="38">38</span><small>个</small></span>
            <span class="stat-label">生产集群</span>
          </div>
          <div class="stat">
            <span class="stat-num"><span data-count="240">240</span><small>+</small></span>
            <span class="stat-label">使用中的团队</span>
          </div>
          <div class="stat">
            <span class="stat-num"><span data-count="4">4</span><small>%</small></span>
            <span class="stat-label">平均资源碎片率</span>
          </div>
        </div>
      </div>
    </section>

    <section class="cta">
      <div class="shell cta-inner">
        <div>
          <p class="label">Talk to us</p>
          <h2 class="cta-title">你的利用率<br>现在是多少？</h2>
        </div>
        <div class="cta-side">
          <p>把当前集群规模与月账单发给我们，48 小时内给出一份可执行的优化清单。</p>
          <a class="btn" href="contact.html">提交数据 <span aria-hidden="true">→</span></a>
        </div>
      </div>
    </section>

  </main>
</body>
</html>
